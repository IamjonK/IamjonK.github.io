<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- blocky sky + ground -->
  <rect width="400" height="250" fill="#7dd3fc"/>
  <rect y="170" width="400" height="80" fill="#5d9c3a"/>
  <g fill="#8b5a2b"><rect y="190" width="400" height="60"/></g>
  <g fill="#6b4420"><rect x="20" y="205" width="20" height="20"/><rect x="120" y="215" width="20" height="20"/><rect x="250" y="200" width="20" height="20"/><rect x="340" y="220" width="20" height="20"/></g>
  <g fill="#4a7f2c"><rect x="0" y="170" width="400" height="8"/></g>
  <!-- crosshair -->
  <g stroke="#fff" stroke-width="3"><line x1="200" y1="110" x2="200" y2="130"/><line x1="190" y1="120" x2="210" y2="120"/></g>
  <!-- click GUI panel -->
  <rect x="14" y="14" width="120" height="132" rx="6" fill="#0f172a" opacity=".92"/>
  <rect x="14" y="14" width="120" height="22" rx="6" fill="#a855f7"/>
  <g fill="#e2e8f0"><rect x="24" y="46" width="70" height="7" rx="2"/><rect x="24" y="66" width="55" height="7" rx="2"/><rect x="24" y="86" width="80" height="7" rx="2"/><rect x="24" y="106" width="60" height="7" rx="2"/><rect x="24" y="126" width="68" height="7" rx="2"/></g>
  <g fill="#a3e635"><rect x="112" y="45" width="14" height="9" rx="4"/><rect x="112" y="85" width="14" height="9" rx="4"/><rect x="112" y="125" width="14" height="9" rx="4"/></g>
  <g fill="#475569"><rect x="112" y="65" width="14" height="9" rx="4"/><rect x="112" y="105" width="14" height="9" rx="4"/></g>
  <!-- HUD: keystrokes -->
  <g fill="#0f172a" opacity=".8"><rect x="318" y="14" width="24" height="24" rx="3"/><rect x="292" y="42" width="24" height="24" rx="3"/><rect x="318" y="42" width="24" height="24" rx="3"/><rect x="344" y="42" width="24" height="24" rx="3"/></g>
  <rect x="318" y="14" width="24" height="24" rx="3" fill="#a855f7" opacity=".9"/>
  <!-- HUD: cps/fps text bars -->
  <g fill="#0f172a" opacity=".8"><rect x="292" y="74" width="76" height="14" rx="3"/><rect x="292" y="92" width="76" height="14" rx="3"/></g>
  <!-- hotbar -->
  <rect x="110" y="222" width="180" height="22" fill="#1f2937" opacity=".85"/>
  <g fill="none" stroke="#9ca3af" stroke-width="1.5"><rect x="112" y="224" width="18" height="18"/><rect x="134" y="224" width="18" height="18"/><rect x="156" y="224" width="18" height="18"/><rect x="178" y="224" width="18" height="18"/><rect x="200" y="224" width="18" height="18"/></g>
  <rect x="112" y="224" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5"/>
</svg>
